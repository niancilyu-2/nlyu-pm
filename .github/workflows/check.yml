name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions, skill list, and per-skill host files agree
        run: python3 scripts/check_release.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate . --strict

      - name: Validate the plugin
        run: claude plugin validate ./plugins/nlyu-pm --strict
