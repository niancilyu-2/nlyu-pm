    - { instance: fosstodon.org, tag: immich, url: "https://fosstodon.org/api/v1/timelines/tag/immich?limit=20" }
    - { instance: mastodon.social, tag: selfhosted, url: "https://mastodon.social/api/v1/timelines/tag/selfhosted?limit=20" }
