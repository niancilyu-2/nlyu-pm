  github_issues_top_html: "https://github.com/immich-app/immich/issues?q=is%3Aissue+{query}+sort%3Areactions-%2B1-desc"   # same order as the API; use when the API returns 403 or 429
  github_discussions_top: "https://github.com/immich-app/immich/discussions?discussions_q={query}+sort%3Atop"
  forum_search_json: "https://forums.truenas.com/search.json?q=immich%20{query}"   # Immich has no Discourse of its own; the TrueNAS Discourse is where home-server users discuss it
  lemmy_search: "https://lemmy.world/api/v3/search?q={query}&type_=Posts&sort=TopYear&limit=10"
  lemmy_communities:
    - immich@lemmy.world
    - selfhosted@lemmy.world
  mastodon_tags:
