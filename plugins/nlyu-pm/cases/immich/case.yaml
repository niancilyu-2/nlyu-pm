  reddit_rss_optional: "https://www.reddit.com/r/immich.rss"   # opt-in only; Claude Code's fetch tool refuses reddit.com; read with curl only if the PM asks
  forum_top_json: null   # the TrueNAS Discourse is only a proxy forum and has no immich tag (checked https://forums.truenas.com/tags.json), so its yearly top list would not be about Immich
  forum_tag_top_json: []   # no immich tag on forums.truenas.com; /tag/immich/l/top.json returns 404
