id: erpnext
name: ERPNext
tier: advanced
persona: Inventory or procurement operations manager who spends the day inside ERPNext keeping stock and purchasing records accurate
mandate: Resolve exceptions without weakening controls or auditability
product_summary: >-
  ERPNext is a free, open-source business management system (an "ERP") that covers stock,
  purchasing, selling, manufacturing and accounting in one web app. It is built on the Frappe
  framework, a Python and JavaScript toolkit that supplies the forms, list views, workflows,
  and permission rules that every ERPNext screen uses. It is used by small and mid-sized
  manufacturers, distributors, retailers and service firms, either self-hosted or on Frappe Cloud.
  The persona covers two ERPNext roles, Stock Manager and Purchase Manager, often held by one
  person in a small or mid-sized company; lanes 1 and 2 map to those two hats.
repositories:
  - role: primary
    owner_repo: frappe/erpnext
    url: https://github.com/frappe/erpnext
    default_branch: develop
    pinned_sha: aebb160e76b2232914ddb0b9d4addbd896a05b83
    pinned_at: "2026-09-17"
    license: GPL-3.0
    clone_to: sources/primary
    sparse_paths:
      - erpnext/stock
      - erpnext/buying
      - erpnext/setup
      - erpnext/public
      - erpnext/controllers
      - erpnext/workspace_sidebar
      - erpnext/desktop_icon
      - erpnext/dock
  - role: companion
    owner_repo: frappe/frappe
    url: https://github.com/frappe/frappe
    default_branch: develop
    pinned_sha: a98db1c248a7444fca8bc9cb9b04273ca78751c3
    pinned_at: "2026-09-17"
    license: MIT
    clone_to: sources/companion
    note: "Framework that ERPNext runs on. Read it to understand forms, list views, workflows, and permissions; do not propose changes to it."
    sparse_paths:
      - frappe/public
      - frappe/desk
      - frappe/workflow
      - frappe/core
      - frappe/model
lanes:
