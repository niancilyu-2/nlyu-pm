exclusions:
  - Tax calculation, tax templates, and anything that changes how tax is computed or reported.
  - Payroll and HR pay processing.
  - Accounting policy, chart-of-accounts design, and valuation-method choices.
  - Regulatory or legal compliance claims of any kind.
  - Any proposal that requires changing how accounting ledger entries are created, edited, or reversed.
  - Country-specific compliance features (regional modules, e-invoicing, statutory formats).
  - Changes to the Frappe framework itself; treat it as read-only context.
synthetic_data_rules:
  - Invent one fictional company (for example "Harborline Supply Co.") and use it consistently across all lanes.
  - Invent three to six warehouses with plain names (Main Store, Receiving Bay, Quarantine, Returns) and made-up locations.
  - Invent items with obviously fake codes (ITM-0001 style) and generic descriptions; never use real product names or barcodes.
  - Invent suppliers with fictional names; never use a real company, real contact, or real supplier code.
  - Use made-up quantities and prices in a single fictional currency; never reuse figures copied from a real quote, catalogue, or invoice.
  - Invent users with clearly fictional names and assign them ERPNext roles by name (Stock User, Stock Manager, Purchase User, Purchase Manager); never use real colleagues.
  - Do not paste data or screenshots from any customer system; the public demo site is acceptable only for observing layout.
public_channels:
  - { type: github-issues, url: https://github.com/frappe/erpnext/issues, note: "Bug reports and feature requests for ERPNext; filter by label stock or buying" }
  - { type: github-issues, url: https://github.com/frappe/frappe/issues, note: "Framework issues covering forms, list views, workflow, and permissions; use in place of GitHub Discussions, which are not enabled on either repo" }
  - { type: official-docs, url: https://docs.frappe.io/erpnext/, note: "User manual; Stock and Buying sections describe each screen step by step" }
  - { type: releases, url: https://github.com/frappe/erpnext/releases, note: "Release notes; useful for spotting recent changes to stock and purchasing screens" }
  - { type: forum, url: https://discuss.frappe.io/, note: "Community Discourse forum; the largest source of real user questions and workarounds" }
  - { type: review-site, url: https://www.softwaresuggest.com/erpnext, note: "Third-party listing with user reviews; treat ratings as indicative only" }
