id: home-assistant
name: Home Assistant
tier: core
persona: Nontechnical household co-admin
mandate: Make routine configuration and recovery safer while preserving local control
product_summary: >-
  Home Assistant is free, open-source smart-home software that runs on a small computer
  inside the house and controls lights, plugs, sensors, speakers and other devices without
  depending on a company's cloud. People use it through a web browser or the companion
  phone app to see dashboards, fix devices that stop responding, and set up automations
  (rules such as "turn on the hallway light when motion is detected after sunset").
repositories:
  - role: primary
    owner_repo: home-assistant/frontend
    url: https://github.com/home-assistant/frontend
    default_branch: dev
    pinned_sha: fb419538c75a66925075be2c301c180676ad746f
    pinned_at: "2026-09-17"
    license: Apache-2.0
    clone_to: sources/primary
    sparse_paths:
      - src/panels/lovelace
      - src/panels/config
      - src/panels/home
      - src/components
      - src/dialogs
      - src/data
      - src/resources
      - src/translations
      - src/panels/profile
  - role: web-reference
    owner_repo: home-assistant/core
    url: https://github.com/home-assistant/core
    default_branch: dev
    pinned_sha: 0cb1d21d32d4281dd4834f303ec6404402f3044d
    pinned_at: "2026-09-17"
    license: Apache-2.0
    clone_to: null
    note: "Context only. Not cloned (294 MB, 28k files). Read specific files via the pinned URLs below."
    web_paths:
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/lovelace
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/config
      - https://github.com/home-assistant/core/blob/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/helpers/entity_registry.py
      - https://github.com/home-assistant/core/blob/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/helpers/device_registry.py
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/automation
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/trace
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/backup
      - https://github.com/home-assistant/core/tree/0cb1d21d32d4281dd4834f303ec6404402f3044d/homeassistant/components/repairs
lanes:
  - id: household-dashboards-and-defaults
    name: Household dashboards and defaults
    surface: tablet web
    viewport: { width: 1024, height: 768 }
    territory: >-
      The Home view and the dashboards a household sees on a shared tablet, the setting
      that decides which dashboard each device and each user opens by default, and light
      edits to cards on an existing dashboard.
    repo_entry_points:
      - src/panels/lovelace/editor
      - src/panels/lovelace/views
      - src/panels/lovelace/cards
      - src/panels/home
      - src/panels/profile/ha-pick-dashboard-row.ts   # per-user default dashboard
      - src/panels/config/lovelace/dashboards   # admin "set as default" for the whole system
  - id: repairs-backups-and-recovery
    name: Repairs, backups, and recovery from updates
    surface: mobile web
    viewport: { width: 390, height: 844 }
    territory: >-
      The Repairs list, backup status and restore, update notices, and the device and
      entity pages used to find what stopped working after a change.
    # This lane never opens an automation trace; that belongs to lane 3.
    repo_entry_points:
      - src/panels/config/repairs
      - src/panels/config/backup
      - src/panels/config/core/ha-config-section-updates.ts   # Settings > System > Updates
      - src/panels/config/dashboard/ha-config-updates.ts   # update notices at the top of Settings
      - src/panels/config/devices
      - src/panels/config/entities
  - id: automation-troubleshooting-and-safe-edits
    name: Automation troubleshooting and safe edits
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      The trace view for a past automation run, the tools for testing triggers and
      conditions, and editing an existing automation without breaking it.
    # May show an unavailable-entity alternate state. Creation from scratch is a lesser
    # focus because the maker has shipped creation work in most recent releases.
    repo_entry_points:
      - src/panels/config/automation
      - src/panels/config/automation/ha-automation-editor.ts
      - src/panels/config/automation/ha-automation-trace.ts
      - src/components/trace
      - src/panels/config/script   # scripts share the editor and trace components
      - src/panels/config/blueprint
exclusions:
  - Safety-critical device classes: locks, garage doors, alarm panels, heating and gas appliances, and medical devices. Do not use them in scenarios, prototypes or synthetic data.
  - Cloud subscription features (Home Assistant Cloud / Nabu Casa remote access, cloud voice assistants, cloud backup locations).
  - YAML-only power-user configuration as the primary path. Text configuration files may be mentioned as an escape hatch, but the persona works in the visual interface.
  - Anything that requires a new core integration or changes to the home-assistant/core repository. Use existing core APIs only.
synthetic_data_rules:
  - Use a fictional home name such as "Willow House"; never a real street address, postcode, or map coordinates.
  - Use generic room names (Living Room, Kitchen, Bedroom, Office, Hallway, Garden) and generic device names (Living Room Lamp, Kitchen Plug, Hallway Motion Sensor, Office Speaker).
  - Use entity identifiers in Home Assistant's own style, for example light.living_room_lamp, sensor.kitchen_temperature, binary_sensor.hallway_motion, switch.office_desk_plug, media_player.living_room_speaker.
  - Never include camera images, video stills, or real people's photos; if a camera card must appear, use a plain grey placeholder labelled "camera preview".
  - Never include real names, e-mail addresses, phone numbers, Wi-Fi names, IP or MAC addresses. If a network address is unavoidable use the documentation range 192.0.2.x.
  - Do not model any excluded device class (locks, garage doors, alarms, heating or gas, medical) even as a decoy.
  - Do not paste text copied from real user posts, issues or reviews into prototypes; paraphrase and label sources in research notes instead.
public_channels:
  - { type: github-issues, url: https://github.com/home-assistant/frontend/issues, note: "Frontend (user interface) bug reports and feature requests; filter by label and by the lane's area" }
  - { type: github-issues, url: https://github.com/home-assistant/core/issues, note: "Core issues; useful for device availability, backup and automation behaviour reports" }
  - { type: github-discussions, url: https://github.com/home-assistant/frontend/discussions, note: "Frontend discussions, lower volume than issues" }
  - { type: official-docs, url: https://www.home-assistant.io/docs/, note: "Official user documentation; dashboards, automations, backups and troubleshooting live under here" }
  - { type: releases, url: https://www.home-assistant.io/blog/categories/release-notes/, note: "Monthly release blog posts; each lists interface changes with screenshots" }
  - { type: forum, url: https://community.home-assistant.io/, note: "Official Discourse forum; the busiest public help channel" }
  - { type: review-site, url: https://apps.apple.com/us/app/home-assistant/id1099568401, note: "Companion app store listing with public user ratings and reviews; the web interface is what the app shows" }
feeds:
  github_issues_top: "https://api.github.com/search/issues?q=repo:home-assistant/frontend+is:issue+{query}&sort=reactions-%2B1&per_page=10"
  github_issues_top_html: "https://github.com/home-assistant/frontend/issues?q=is%3Aissue+{query}+sort%3Areactions-%2B1-desc"   # same order as the API; use when the API returns 403 or 429
  github_discussions_top: "https://github.com/home-assistant/frontend/discussions?discussions_q={query}+sort%3Atop"   # core has Discussions disabled
  forum_search_json: "https://community.home-assistant.io/search.json?q={query}"
  lemmy_search: "https://lemmy.world/api/v3/search?q={query}&type_=Posts&sort=TopYear&limit=10"
  lemmy_communities:
    - homeassistant@lemmy.world
    - homeautomation@lemmy.world
    - selfhosted@lemmy.world
  mastodon_tags:
    - { instance: mastodon.social, tag: homeassistant, url: "https://mastodon.social/api/v1/timelines/tag/homeassistant?limit=20" }
    - { instance: fosstodon.org, tag: homeassistant, url: "https://fosstodon.org/api/v1/timelines/tag/homeassistant?limit=20" }
    - { instance: mastodon.social, tag: smarthome, url: "https://mastodon.social/api/v1/timelines/tag/smarthome?limit=20" }
  hackernews_search: "https://hn.algolia.com/api/v1/search?query={query}&tags=story&hitsPerPage=10"
  app_store_reviews:
    - { app: "Home Assistant", id: 1099568401, url: "https://itunes.apple.com/us/rss/customerreviews/id=1099568401/sortBy=mostRecent/json" }
  adoption:
    - { type: github-repo, url: "https://api.github.com/repos/home-assistant/frontend", fields: "stargazers_count, open_issues_count, pushed_at" }
    - { type: github-repo, url: "https://api.github.com/repos/home-assistant/core", fields: "stargazers_count, open_issues_count, pushed_at" }
    - { type: docker-hub, url: "https://hub.docker.com/v2/repositories/homeassistant/home-assistant/", fields: "pull_count, last_updated" }
    - { type: pypi-stats, url: "https://pypistats.org/api/packages/homeassistant/recent", fields: "data.last_month, data.last_week" }
  competitors:
    - { name: "Samsung SmartThings", page: "https://www.smartthings.com", wayback: "https://archive.org/wayback/available?url=www.smartthings.com&timestamp={yyyymmdd}" }
    - { name: "Hubitat", page: "https://hubitat.com/products", wayback: "https://archive.org/wayback/available?url=hubitat.com/products&timestamp={yyyymmdd}" }
    - { name: "Homey", page: "https://homey.app/en-us/homey-pro", wayback: "https://archive.org/wayback/available?url=homey.app/en-us/homey-pro&timestamp={yyyymmdd}" }
    - { name: "openHAB", page: "https://www.openhab.org", wayback: "https://archive.org/wayback/available?url=www.openhab.org&timestamp={yyyymmdd}" }
  reddit_rss_optional: "https://www.reddit.com/r/homeassistant.rss"   # opt-in only; Claude Code's fetch tool refuses reddit.com; read with curl only if the PM asks
  forum_top_json: "https://community.home-assistant.io/top.json?period=yearly"
  forum_tag_top_json:   # tags.json counts on 2026-09-22: automation 21134, dashboard 1778, update 740, backup 627; devices (157) and repairs (13) dropped
    - { tag: automation, url: "https://community.home-assistant.io/tag/automation/l/top.json?period=yearly" }
    - { tag: dashboard, url: "https://community.home-assistant.io/tag/dashboard/l/top.json?period=yearly" }
    - { tag: update, url: "https://community.home-assistant.io/tag/update/l/top.json?period=yearly" }
    - { tag: backup, url: "https://community.home-assistant.io/tag/backup/l/top.json?period=yearly" }
  hackernews_comments: "https://hn.algolia.com/api/v1/search?query={query}&tags=comment&hitsPerPage=10"
  app_store_lookup:
    - { app: "Home Assistant", id: 1099568401, url: "https://itunes.apple.com/lookup?id=1099568401&country=us", fields: "averageUserRating, userRatingCount, version, releaseNotes, currentVersionReleaseDate" }
  play_store_page: { app: "Home Assistant", package: io.homeassistant.companion.android, url: "https://play.google.com/store/apps/details?id=io.homeassistant.companion.android" }   # the PM opens it and pastes reviews; not fetched
  wikipedia_pageviews:
    - { article: "Home_Assistant", url: "https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia/all-access/user/Home_Assistant/monthly/{start}/{end}" }
  roadmap:
    own:
      - { type: github-projects, url: "https://github.com/orgs/home-assistant/projects" }
      - { type: github-milestones, url: "https://github.com/home-assistant/frontend/milestones" }
      - { type: github-milestones, url: "https://github.com/home-assistant/core/milestones" }
      - { type: roadmap-page, url: "https://www.home-assistant.io/blog/categories/roadmap/" }   # half-yearly roadmap posts from the Home Assistant founders
    competitor_jobs:
      - { name: "Samsung SmartThings", type: page, url: "https://www.samsung.com/us/careers/" }   # smartthings.com/careers returns 404
      # Hubitat omitted: hubitat.com/pages/careers returns 404, the homepage has no jobs link, and no Ashby, Greenhouse or Lever board exists under hubitat
      - { name: "Homey", type: page, url: "https://homey.app/en-us/careers/" }
      # openHAB omitted: community project run by the openHAB Foundation e.V.; neither openhab.org nor openhabfoundation.org has a jobs or careers page
