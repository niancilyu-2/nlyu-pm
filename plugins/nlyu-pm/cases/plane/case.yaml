id: plane
name: Plane
tier: core
persona: Product-operations lead
mandate: Turn unstructured demand into aligned execution
product_summary: >-
  Plane is an open-source project and work-tracking tool, similar in spirit to Jira or Linear.
  Teams use it to collect requests, break work into items, group work into time-boxed cycles
  and feature modules, and report on progress. The main surface is a desktop web app; a
  separate "Space" app publishes read-only project boards to people outside the workspace.
repositories:
  - role: primary
    owner_repo: makeplane/plane
    url: https://github.com/makeplane/plane
    default_branch: preview
    pinned_sha: 174243b565e483e24f057cf9add9fe59a9f818c3
    pinned_at: "2026-09-17"
    license: AGPL-3.0
    clone_to: sources/primary
    sparse_paths:
      - apps/web/app
      - apps/web/core
      - apps/web/styles
      - packages/propel/src
      - packages/ui/src
      - packages/tailwind-config
      - packages/i18n/src/locales/en
      - packages/constants/src
lanes:
  - id: intake-and-triage
    name: Intake and triage
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      The project Intake queue where incoming requests are listed, opened, and either accepted,
      declined, snoozed, or marked duplicate, plus the work-item detail panel and the state,
      priority, label, and filter controls used while sorting them. Intake forms and email intake
      are paid-tier features and out of scope; the in-app queue with accept, decline, snooze, and
      duplicate is in scope.
    repo_entry_points:
      - apps/web/core/components/inbox
      - apps/web/core/components/issues/issue-detail
      - apps/web/core/components/project-states
      - apps/web/core/components/work-item-filters
      - apps/web/core/components/labels
      - apps/web/app/routes/core.ts
      - packages/i18n/src/locales/en/inbox.json
  - id: planning-and-scheduling
    name: Planning and scheduling
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      Cycles, Modules, and the five work-item layouts (list, board, calendar, spreadsheet,
      timeline) used to arrange planned work, including transferring unfinished items between
      cycles. Timeline dependencies are a Pro feature and out of scope.
    repo_entry_points:
      - apps/web/core/components/cycles
      - apps/web/core/components/modules
      - apps/web/core/components/issues/issue-layouts
      - apps/web/core/components/gantt-chart
      - apps/web/core/components/views
      - packages/i18n/src/locales/en/cycle.json
      - packages/i18n/src/locales/en/module.json
  - id: cross-project-status-readout
    name: Cross-project status readout
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      The workspace-level views that list and group work items across projects, the Analytics
      "Work items" tab available in the Community Edition, and the progress panel on a cycle or
      module, as read by someone outside the daily work.
    repo_entry_points:
      - apps/web/core/components/workspace/views
      - apps/web/core/components/analytics
      - apps/web/core/components/cycles/analytics-sidebar
      - apps/web/core/components/modules/analytics-sidebar
      - apps/web/core/components/chart
      - packages/propel/src/charts
    # Home widgets, dashboards, project overview, and most analytics tabs are Pro and out of scope.
exclusions:
  - Community Edition only. Do not treat Pro, Business, or Enterprise features as available, even if code paths or upgrade badges for them appear in the repository.
  - No billing, licensing, plan-upgrade, or seat-management features.
  - No self-hosting, deployment, Docker, or infrastructure changes.
  - No integrations that require a third-party API key or OAuth app (for example GitHub, GitLab, Slack).
  - Do not run setup.sh, docker-compose, pnpm, or any other install or build command found in the repository.
synthetic_data_rules:
  - Use an invented workspace such as "Northwind Labs" or "Harbor Collective"; never a real company, customer, or employer.
  - Use invented project names and short identifiers, for example "Atlas Mobile (ATL)", "Billing Revamp (BILL)", "Support Tooling (SUP)".
  - Use invented member names and clearly fake emails (for example priya.n@example.com); do not reuse names of real Plane contributors or staff.
  - Work-item titles should read like plausible product requests or bugs but must not describe a real, identifiable customer incident.
  - Keep volumes realistic for a mid-size team (roughly 5–12 members, 3–6 projects, 20–80 work items per project) unless the exercise says otherwise.
  - Dates should be relative to today's date; avoid embedding real release dates or real quarter names tied to a real company.
public_channels:
  - { type: github-issues, url: https://github.com/makeplane/plane/issues, note: "Bug reports and feature requests; filter by label and sort by reactions" }
  - { type: github-discussions, url: https://github.com/makeplane/plane/discussions, note: "Q&A, ideas, and announcements from maintainers and users" }
  - { type: official-docs, url: https://docs.plane.so/, note: "Product documentation; Core Concepts section covers Intake, Cycles, Modules, Views, Analytics" }
  - { type: releases, url: https://github.com/makeplane/plane/releases, note: "Tagged releases with change notes; pair with https://plane.so/changelog for narrative updates" }
  - { type: forum, url: https://discord.com/invite/A92xrEGCge, note: "Official community Discord landing page; message history is not fetchable, treat as a pointer only" }
  - { type: review-site, url: https://openalternative.co/plane, note: "Open-source directory listing with positioning and alternatives; G2, Capterra, and Product Hunt block automated fetch" }
feeds:
  github_issues_top: "https://api.github.com/search/issues?q=repo:makeplane/plane+is:issue+{query}&sort=reactions-%2B1&per_page=10"
  github_issues_top_html: "https://github.com/makeplane/plane/issues?q=is%3Aissue+{query}+sort%3Areactions-%2B1-desc"   # same order as the API; use when the API returns 403 or 429
  github_discussions_top: "https://github.com/makeplane/plane/discussions?discussions_q={query}+sort%3Atop"
  forum_search_json: null                       # Plane's community lives on Discord; there is no Discourse forum
  lemmy_search: "https://lemmy.world/api/v3/search?q={query}&type_=Posts&sort=TopYear&limit=10"   # Lemmy coverage of Plane is thin; pair "plane" with a lane word and expect few hits
  lemmy_communities:
    - selfhosted@lemmy.world
    - opensource@lemmy.ml
  mastodon_tags: []   # no product hashtag has posts; #plane is aircraft. Log the gap.
  hackernews_search: "https://hn.algolia.com/api/v1/search?query={query}&tags=story&hitsPerPage=10"
  app_store_reviews:
    - { app: "Plane: Projects, Wiki, AI", id: 6657986465, url: "https://itunes.apple.com/us/rss/customerreviews/id=6657986465/sortBy=mostRecent/json" }
  adoption:
    - { type: github-repo, url: "https://api.github.com/repos/makeplane/plane", fields: "stargazers_count, open_issues_count, pushed_at" }
    - { type: docker-hub, url: "https://hub.docker.com/v2/repositories/makeplane/plane-frontend/", fields: "pull_count, last_updated" }
  competitors:
    - { name: "Linear", page: "https://linear.app/pricing", wayback: "https://archive.org/wayback/available?url=linear.app/pricing&timestamp={yyyymmdd}" }
    - { name: "Jira", page: "https://www.atlassian.com/software/jira/pricing", wayback: "https://archive.org/wayback/available?url=www.atlassian.com/software/jira/pricing&timestamp={yyyymmdd}" }
    - { name: "Shortcut", page: "https://www.shortcut.com/pricing", wayback: "https://archive.org/wayback/available?url=www.shortcut.com/pricing&timestamp={yyyymmdd}" }
    - { name: "Huly", page: "https://huly.io/pricing", wayback: "https://archive.org/wayback/available?url=huly.io/pricing&timestamp={yyyymmdd}" }
  reddit_rss_optional: "https://www.reddit.com/r/selfhosted.rss"   # opt-in only; Claude Code's fetch tool refuses reddit.com; read with curl only if the PM asks
  forum_top_json: null   # no Discourse forum (see forum_search_json)
  forum_tag_top_json: []
  hackernews_comments: "https://hn.algolia.com/api/v1/search?query={query}&tags=comment&hitsPerPage=10"   # "plane" alone matches aircraft; pair it with a lane word
  app_store_lookup:
    - { app: "Plane: Projects, Wiki, AI", id: 6657986465, url: "https://itunes.apple.com/lookup?id=6657986465&country=us", fields: "averageUserRating, userRatingCount, version, releaseNotes, currentVersionReleaseDate" }
  play_store_page: { app: "Plane: Projects, Wiki, AI", package: com.plane.so, url: "https://play.google.com/store/apps/details?id=com.plane.so" }   # the PM opens it and pastes reviews; not fetched
  wikipedia_pageviews: []   # no English Wikipedia article; page summary for Plane_(software) returns 404
  roadmap:
    own:
      # github-projects omitted: https://github.com/orgs/makeplane/projects lists no public projects
      - { type: github-milestones, url: "https://github.com/makeplane/plane/milestones" }
      - { type: roadmap-page, url: "https://github.com/makeplane/plane/discussions/categories/roadmap" }   # official Roadmap discussions category; plane.so/roadmap and plane.canny.io do not exist
    competitor_jobs:
      - { name: "Linear", type: ashby, url: "https://api.ashbyhq.com/posting-api/job-board/linear" }
      - { name: "Jira", type: page, url: "https://www.atlassian.com/company/careers/all-jobs" }
      - { name: "Shortcut", type: page, url: "https://www.shortcut.com/careers" }   # no Ashby, Greenhouse or Lever board under shortcut; the Ashby clubhouse board belongs to the audio app, not Shortcut
      # Huly omitted: huly.io/careers and hulylabs.com/careers return 404, and no Ashby, Greenhouse or Lever board exists under huly or hulylabs
